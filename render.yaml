# Render.com Infrastructure-as-Code for OpenWA (Clean Render Setup - 100% Free & No Sleep Crash)
services:
  - type: web
    name: openwa-whatsapp-gateway
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 2785
      - key: NODE_ENV
        value: production
      - key: AUTO_START_SESSIONS
        value: "true"
      - key: API_MASTER_KEY
        value: "mysecretkey"
      - key: ENGINE_TYPE
        value: baileys
      - key: DATABASE_TYPE
        value: sqlite
      - key: DATABASE_NAME
        value: ./data/openwa.sqlite
      - key: DATABASE_SYNCHRONIZE
        value: "false"
      - key: MAIN_DATABASE_SYNCHRONIZE
        value: "true"
      - key: SESSION_DATA_PATH
        value: ./data/sessions
      - key: CSP_UPGRADE_INSECURE_REQUESTS
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
