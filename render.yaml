# Render.com Infrastructure-as-Code (Blueprint) for OpenWA
services:
  - type: web
    name: openwa-whatsapp-gateway
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free # 100% Free plan on Render
    region: singapore # Options: oregon, frankfort, singapore, ohio
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: PORT
        value: 2785
      - key: NODE_ENV
        value: production
      - key: AUTO_START_SESSIONS
        value: "true"
      - key: API_MASTER_KEY
        value: "owa_master_key_998877665544332211"
      - key: MAX_CONCURRENT_SESSIONS
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
      - key: WWEBJS_AUTH_TIMEOUT_MS
        value: "120000"
      - key: DATABASE_TYPE
        value: sqlite
      - key: DATABASE_NAME
        value: ./data/openwa.sqlite
      - key: DATABASE_SYNCHRONIZE
        value: "false"
      - key: MAIN_DATABASE_SYNCHRONIZE
        value: "true"
      - key: ENGINE_TYPE
        value: baileys
      - key: SESSION_DATA_PATH
        value: ./data/sessions
      - key: PUPPETEER_HEADLESS
        value: "true"
      - key: PUPPETEER_ARGS
        value: --no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu,--disable-accelerated-2d-canvas,--no-first-run,--no-zygote,--single-process,--disable-extensions,--disable-default-apps,--mute-audio,--disable-background-timer-throttling,--disable-backgrounding-occluded-windows,--disable-renderer-backgrounding
      - key: CSP_UPGRADE_INSECURE_REQUESTS
        value: "false"
      - key: WWEBJS_ONBOARDING_CONTINUE_LABELS
        value: Continue,Continuar,Weiter,Lanjutkan,Done,Ok,Got it
      - key: CORS_ORIGINS
        value: "https://openwa-whatsapp-gateway.onrender.com,http://localhost:2785,http://localhost:3000"
